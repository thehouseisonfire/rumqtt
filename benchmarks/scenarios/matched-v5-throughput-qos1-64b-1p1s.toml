name = "matched-v5-throughput-qos1-64b-1p1s"
group = "matched"
command = "throughput"
description = "Matched MQTT 5 QoS 1 baseline throughput with a 64-byte payload."
primary_metric = "throughput_msg_sec"
higher_is_better = true
requires_broker = true
transport = "tcp"

[quality]
min_success_rate = 1.0
min_measured_runs = 12
max_primary_cv_pct = 10.0
max_primary_mad_pct = 5.0
max_relative_ci_width_pct = 10.0

[args]
duration_sec = 10
warmup_sec = 2
drain_sec = 5
payload_size = 64
qos = 1
topic = "bench/matched/v5/throughput/qos1/64b/1p1s"
publishers = 1
subscribers = 1
window = 100
receive_maximum = 100
keepalive_sec = 30
operation_timeout_sec = 10
