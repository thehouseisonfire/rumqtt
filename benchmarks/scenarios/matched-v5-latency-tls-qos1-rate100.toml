name = "matched-v5-latency-tls-qos1-rate100"
group = "matched"
command = "latency"
description = "Matched MQTT 5 private-CA TLS latency smoke at 100 messages per second."
primary_metric = "p99_us"
higher_is_better = false
requires_broker = true
transport = "tls"

[quality]
min_success_rate = 1.0
min_measured_runs = 12
max_primary_cv_pct = 10.0
max_primary_mad_pct = 5.0
max_relative_ci_width_pct = 10.0

[args]
duration_sec = 10
warmup_sec = 2
drain_sec = 5
payload_size = 1024
qos = 1
topic = "bench/matched/v5/tls/latency/qos1/rate100"
rate = 100
window = 100
receive_maximum = 100
keep_alive_seconds = 30
operation_timeout_sec = 10
