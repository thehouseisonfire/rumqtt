[package]
name = "rumqttc-wrapper-core-next"
version = "0.34.0-alpha"
publish = true
description = "Owned, protocol-neutral support for native rumqttc wrappers"
keywords = ["mqtt", "iot", "wrapper", "ffi"]
categories = ["network-programming"]
rust-version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"

[lib]
name = "rumqttc_wrapper_core"

[features]
panic-testing = []

[dependencies]
bytes = "1.5"
flume = { version = "0.12", default-features = false, features = ["async", "select"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
futures-executor = "0.3"
parking_lot = "0.12"
thiserror = "2.0.8"
tokio = { version = "1.40", features = ["macros", "rt", "sync", "time"] }
rumqttc_v4 = { package = "rumqttc-v4-next", path = "../../rumqttc-v4", version = "0.34.0-alpha", features = ["websocket"] }
rumqttc_v5 = { package = "rumqttc-v5-next", path = "../../rumqttc-v5", version = "0.34.0-alpha", features = ["websocket"] }
