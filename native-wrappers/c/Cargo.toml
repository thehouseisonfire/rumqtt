[package]
name = "rumqttc-c-next"
version = "0.1.0-alpha"
publish = true
description = "Pre-stable C ABI for the rumqttc MQTT 3.1.1 and MQTT 5 clients"
keywords = ["mqtt", "ffi", "c-api"]
categories = ["network-programming", "api-bindings"]
rust-version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"
# Keep raw development measurements out of the published library.
exclude = ["benches/publish-buffer-results/**"]

[lib]
name = "rumqttc"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["use-rustls", "websocket"]
use-rustls = ["use-rustls-aws-lc"]
tls12 = ["rumqttc-wrapper-core-next/tls12"]
use-rustls-ring = ["rumqttc-wrapper-core-next/use-rustls-ring"]
use-rustls-aws-lc = ["rumqttc-wrapper-core-next/use-rustls-aws-lc"]
use-native-tls = ["rumqttc-wrapper-core-next/use-native-tls"]
websocket = ["rumqttc-wrapper-core-next/websocket"]
http-proxy = ["rumqttc-wrapper-core-next/http-proxy"]
socks-proxy = ["rumqttc-wrapper-core-next/socks-proxy"]
proxy = ["http-proxy", "socks-proxy"]
system-srv-resolver = ["rumqttc-wrapper-core-next/system-srv-resolver"]
auth-scram = ["rumqttc-wrapper-core-next/auth-scram"]
ordered-shutdown = ["rumqttc-wrapper-core-next/ordered-shutdown"]
readiness = ["rumqttc-wrapper-core-next/readiness"]
tracing = ["rumqttc-wrapper-core-next/tracing"]
tracing-log-compat = ["tracing", "rumqttc-wrapper-core-next/tracing-log-compat"]

file-session-store = ["rumqttc-wrapper-core-next/file-session-store"]
# Private ownership/measurement fixture; does not change the C capability set.
publish-buffer-proof = ["dep:cc"]

[dependencies]
bytes = "1.12.1"
rumqttc-wrapper-core-next = { path = "../wrapper-core", version = "0.34.0-alpha", default-features = false }
tokio = { version = "1.40", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.40", features = ["rt", "macros"] }

[build-dependencies]
cbindgen = "0.29"
cc = { version = "1", optional = true }
