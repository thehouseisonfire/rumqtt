[package]
name = "rumqttc-python-next"
version = "0.1.0-alpha.0"
publish = false
description = "Typed asyncio bindings for the rumqttc MQTT clients"
rust-version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"

[lib]
name = "rumqttc_python"
crate-type = ["cdylib", "rlib"]

[features]
benchmark-testing = []
panic-testing = ["rumqttc-wrapper-core-next/panic-testing"]

[dependencies]
base64 = "0.23"
bytes = "1.5"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
pyo3 = "0.29.2"
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
rumqttc-wrapper-core-next = { path = "../wrapper-core", version = "0.34.0-alpha" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.40", features = ["rt", "sync", "time"] }
