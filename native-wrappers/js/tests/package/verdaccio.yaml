storage: /tmp/rumqttc-js-verdaccio
auth:
  htpasswd:
    file: /tmp/rumqttc-js-verdaccio.htpasswd
    max_users: -1
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
packages:
  '@*/*':
    access: $all
    publish: $all
    unpublish: $all
    proxy: npmjs
  '**':
    access: $all
    publish: $all
    unpublish: $all
    proxy: npmjs
log: { type: stdout, format: pretty, level: warn }
