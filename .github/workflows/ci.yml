on:
  pull_request:
    branches:
      - main
      - mqtt5-client
    paths:
      - 'mqttbytes-core/**'
      - 'mqttbytes-v4/**'
      - 'mqttbytes-v5/**'
      - 'rumqttc-core/**'
      - 'rumqttc-next/**'
      - 'rumqttc-v4/**'
      - 'rumqttc-v5/**'
      - 'rumqttc-wrapper-core/**'
      - 'rumqttc-c/**'
      - 'benchmarks/**'
      - '**.md'
      - 'Cargo.*'
      - '*/Cargo.*'
      - 'clippy.toml'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'scripts/check-markdown-links.py'
      - 'scripts/check-recipes.py'
      - 'scripts/smoke-production-recipes.sh'
      - 'scripts/test-low-memory.sh'
      - 'tests/low-memory/**'
      - '.dockerignore'
      - '.github/workflows/*'
  push:
    branches:
      - main

name: CI

permissions:
  contents: read
  attestations: read

env:
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  low-memory:
    name: Strict 10 MiB client profile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run v4 and v5 under the cgroup memory limit
        run: scripts/test-low-memory.sh --results-dir target/low-memory/ci-results

      - name: Test memory-stability result calculations
        run: python3 -m unittest tests/low-memory/test_memory_stability_report.py

      - name: Preserve low-memory diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: low-memory-results
          path: target/low-memory/ci-results
          if-no-files-found: warn

  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: Linux-client-msrv

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: Check client workspace
        run: cargo check --locked --workspace --exclude benchmarks --all-targets

      - name: Check client feature matrix
        run: |
          cargo hack --locked --each-feature --exclude-all-features \
            check \
            -p mqttbytes-v4-next \
            -p mqttbytes-v5-next \
            -p rumqttc-v4-next \
            -p rumqttc-v5-next

  no-std:
    name: Bare-metal MQTT codecs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: thumbv7em-none-eabi

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: Linux-mqttbytes-no-std

      - name: Check no_std codec dependency closure
        run: |
          cargo check --locked --no-default-features --target thumbv7em-none-eabi \
            -p mqttbytes-core-next \
            -p mqttbytes-v4-next \
            -p mqttbytes-v5-next

  test:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check documentation links
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: python3 scripts/check-markdown-links.py

      # use mold linker instead of the default linker only on linux
      - uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-cargo

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack,cargo-llvm-cov,nextest

      - name: Check production recipes
        if: ${{ runner.os == 'Linux' }}
        run: |
            python3 scripts/check-recipes.py
            docker compose -f docs/recipes/fixtures/mosquitto/compose.yaml config --quiet
            docker compose -f docs/recipes/fixtures/emqx/compose.yaml config --quiet

      - name: Smoke test production broker recipe
        if: ${{ runner.os == 'Linux' }}
        run: scripts/smoke-production-recipes.sh

      - name: Install Mosquitto
        if: ${{ runner.os == 'Linux' }}
        run: |
            sudo apt-get update
            sudo apt-get install -y mosquitto

      - name: Check benchmarks
        env:
          RUSTFLAGS: "-D warnings"
        run: |
            cargo check -p benchmarks --all-targets
            cargo clippy -p benchmarks --all-targets -- -D warnings
            cargo test -p benchmarks --lib --bins
            cargo test -p benchmarks --test codec_smoke
            python3 -m compileall benchmarks/runner.py
            python3 -m unittest discover -s benchmarks/tests -p 'test_*.py'

      - name: Check rumqttc
        env:
          RUSTFLAGS: "-D warnings -W clippy::pedantic -W clippy::nursery"
        run: |
            fix_args=()
            if [[ "${{ runner.os }}" == 'Linux' ]]; then
              fix_args=(--fix --allow-dirty)
            fi
            cargo hack clippy "${fix_args[@]}" --verbose --each-feature --exclude-all-features --no-dev-deps -p rumqttc-v4-next
            cargo hack clippy "${fix_args[@]}" --verbose --each-feature --exclude-all-features --no-dev-deps -p rumqttc-v5-next

      - name: Check standalone crates
        env:
          RUSTFLAGS: "-D warnings -W clippy::pedantic -W clippy::nursery"
        run: |
            cargo clippy --fix --allow-dirty --verbose --all-targets -p mqttbytes-core-next
            cargo clippy --fix --allow-dirty --verbose --all-targets -p rumqttc-wrapper-core-next
            cargo clippy --fix --allow-dirty --verbose --all-targets -p rumqttc-c-next
            cargo hack clippy --fix --allow-dirty --verbose --each-feature --exclude-all-features --no-dev-deps -p mqttbytes-v4-next
            cargo hack clippy --fix --allow-dirty --verbose --each-feature --exclude-all-features --no-dev-deps -p mqttbytes-v5-next
            cargo hack clippy --fix --allow-dirty --verbose --each-feature --exclude-all-features --no-dev-deps -p rumqttc-core-next
            cargo hack clippy --fix --allow-dirty --verbose --each-feature --exclude-all-features --no-dev-deps -p rumqttc-next

      - name: Check docs
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
            cargo hack doc --verbose --no-deps --each-feature --exclude-all-features --no-dev-deps -p rumqttc-v4-next
            cargo hack doc --verbose --no-deps --each-feature --exclude-all-features --no-dev-deps -p rumqttc-v5-next

      - name: Check standalone crate docs
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
            cargo doc --verbose --no-deps -p mqttbytes-core-next
            cargo doc --verbose --no-deps -p rumqttc-wrapper-core-next
            cargo doc --verbose --no-deps -p rumqttc-c-next
            cargo hack doc --verbose --no-deps --each-feature --exclude-all-features --no-dev-deps -p mqttbytes-v4-next
            cargo hack doc --verbose --no-deps --each-feature --exclude-all-features --no-dev-deps -p mqttbytes-v5-next
            cargo hack doc --verbose --no-deps --each-feature --exclude-all-features --no-dev-deps -p rumqttc-core-next
            cargo hack doc --verbose --no-deps --each-feature --exclude-all-features --no-dev-deps -p rumqttc-next

      - name: Doctests
        run: |
            cargo hack --each-feature --exclude-all-features test --doc -p rumqttc-v4-next
            cargo hack --each-feature --exclude-all-features test --doc -p rumqttc-v5-next

      - name: Standalone crate doctests
        run: |
            cargo test --doc -p mqttbytes-core-next
            cargo test --doc -p rumqttc-wrapper-core-next
            cargo test --doc -p rumqttc-c-next
            cargo hack --each-feature --exclude-all-features test --doc -p mqttbytes-v4-next
            cargo hack --each-feature --exclude-all-features test --doc -p mqttbytes-v5-next
            cargo hack --each-feature --exclude-all-features test --doc -p rumqttc-core-next
            cargo hack --each-feature --exclude-all-features test --doc -p rumqttc-next

      - name: Test rumqttc
        run: |
            cargo hack --each-feature --exclude-all-features nextest run -p rumqttc-v4-next
            cargo hack --each-feature --exclude-all-features nextest run -p rumqttc-v5-next

      - name: Test standalone crates
        run: |
            cargo test -p mqttbytes-core-next
            cargo test -p rumqttc-wrapper-core-next
            cargo test -p rumqttc-c-next
            cargo hack --each-feature --exclude-all-features test -p mqttbytes-v4-next
            cargo hack --each-feature --exclude-all-features test -p mqttbytes-v5-next
            cargo hack --each-feature --exclude-all-features test -p rumqttc-core-next
            cargo hack --each-feature --exclude-all-features test -p rumqttc-next

      - name: C FFI/header consistency
        if: ${{ runner.os != 'Windows' }}
        run: rumqttc-c/tests/abi/check.sh ffi-header

      - name: C FFI/header consistency (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: rumqttc-c/tests/abi/check.ps1 ffi-header

      - name: C current export policy
        if: ${{ runner.os != 'Windows' }}
        run: rumqttc-c/tests/abi/check.sh exports

      - name: C current export policy (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: rumqttc-c/tests/abi/check.ps1 exports

      - name: C native consumers
        if: ${{ runner.os != 'Windows' }}
        run: rumqttc-c/tests/abi/check.sh native

      - name: C native consumers (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: rumqttc-c/tests/abi/check.ps1 native

      - name: C native integration, stress, and examples
        run: |
            cmake -S rumqttc-c/tests/native -B target/rumqttc-c-native -DCMAKE_BUILD_TYPE=Debug
            cmake --build target/rumqttc-c-native --config Debug
            ctest --test-dir target/rumqttc-c-native -C Debug --output-on-failure

      - name: C package consumers
        if: ${{ runner.os != 'Windows' }}
        run: rumqttc-c/tests/abi/check.sh package

      - name: C package consumers (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: rumqttc-c/tests/abi/check.ps1 package

      - name: C ABI mutation corpus
        if: ${{ runner.os == 'Linux' }}
        run: |
          tool="$(rumqttc-c/tests/abi/install-abi-compliance-checker.sh)"
          python3 rumqttc-c/tests/abi/mutation_matrix.py --abicc "$tool" --output target/abi-mutations
          python3 -m unittest discover -s rumqttc-c/tests/abi -p 'test_*.py'

      - name: C historical ABI compatibility
        if: ${{ runner.os != 'Windows' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: rumqttc-c/tests/abi/compare-release.sh

      - name: C historical ABI compatibility (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: rumqttc-c/tests/abi/compare-release.ps1

      - name: Preserve C ABI diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: c-abi-diagnostics-${{ runner.os }}
          path: |
            target/abi-mutations
            target/abi-reports
          if-no-files-found: ignore

      - name: Test native-tls WSS integration
        run: |
            cargo test --manifest-path rumqttc-v4/Cargo.toml --no-default-features --features "websocket,use-native-tls" --lib transport::tests::wss_default_config_uses_native_tls_when_rustls_is_disabled -- --exact
            cargo test --manifest-path rumqttc-v5/Cargo.toml --no-default-features --features "websocket,use-native-tls" --lib transport::tests::wss_default_config_uses_native_tls_when_rustls_is_disabled -- --exact
            cargo test --manifest-path rumqttc-v4/Cargo.toml --no-default-features --features "websocket,use-native-tls" --test websocket_integration
            cargo test --manifest-path rumqttc-v5/Cargo.toml --no-default-features --features "websocket,use-native-tls" --test websocket_integration

      - name: Verify rustls provider conflict guard
        run: |
            if cargo check -p rumqttc-v4-next --no-default-features --features "use-rustls-aws-lc,use-rustls-ring"; then
              echo "Expected mutually-exclusive rustls provider feature check for rumqttc-v4-next to fail, but it succeeded."
              exit 1
            fi
            if cargo check -p rumqttc-v5-next --no-default-features --features "use-rustls-aws-lc,use-rustls-ring"; then
              echo "Expected mutually-exclusive rustls provider feature check for rumqttc-v5-next to fail, but it succeeded."
              exit 1
            fi
            echo "Mutually-exclusive rustls provider feature guards failed as expected."

      - name: Verify cross-crate transport feature isolation
        run: |
            cargo check -p rumqttc-v4-next -p rumqttc-v5-next --no-default-features -F rumqttc-v5-next/websocket
            cargo check -p rumqttc-v4-next -p rumqttc-v5-next --no-default-features -F rumqttc-v4-next/websocket
            cargo check -p rumqttc-v4-next -p rumqttc-v5-next --no-default-features --features "rumqttc-v4-next/use-rustls-ring rumqttc-v5-next/use-rustls-aws-lc"
            cargo check -p rumqttc-v4-next -p rumqttc-v5-next --no-default-features --features "rumqttc-v4-next/use-rustls-aws-lc rumqttc-v5-next/use-rustls-ring"

      - name: Verify rumqttc-next feature forwarding
        run: |
            cargo check -p rumqttc-next --no-default-features --features websocket
            cargo check -p rumqttc-next --no-default-features --features use-native-tls
            cargo check -p rumqttc-next --no-default-features --features "auth-scram,url"

      - name: Check workspace
        run: |
          cargo check --workspace

  benchmark-broker-fixture:
    name: Benchmark broker fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: Linux-cargo-benchmark-fixture

      - name: Check benchmark fixture
        env:
          RUSTFLAGS: "-D warnings"
        run: |
            cargo check -p benchmarks --features websocket --all-targets
            python3 -m compileall benchmarks/runner.py benchmarks/broker_fixture.py
            python3 -m unittest benchmarks/tests/test_runner.py benchmarks/tests/test_broker_fixture.py

      - name: Check codec profiling
        env:
          RUSTFLAGS: "-D warnings"
        run: |
            cargo check -p benchmarks --features profiling --all-targets
            cargo run -p benchmarks --features profiling --bin rumqtt-bench -- \
              codec decode --protocol v5 --messages 100000 --payload-size 64 --qos 1 \
              --profile-output /tmp/rumqtt-codec.pb
            test -s /tmp/rumqtt-codec.pb

      - name: Validate synthetic benchmark router
        env:
          RUSTFLAGS: "-D warnings"
        run: |
            python3 benchmarks/broker_fixture.py validate \
              --backend synthetic \
              --transport tcp \
              --scenario client-v4-throughput-qos1 \
              --scenario client-v5-throughput-qos1 \
              --scenario matched-v5-throughput-qos1-1kib-1p1s \
              --runs 1 \
              --warmup-runs 0 \
              --cargo-profile dev \
              --output-dir /tmp/rumqtt-bench-synthetic-fixture

      - name: Validate websocket benchmark scenarios
        env:
          RUSTFLAGS: "-D warnings"
        run: |
            python3 benchmarks/broker_fixture.py validate \
              --transport websocket \
              --scenario client-v4-throughput-websocket-qos1-1kib-1p1s \
              --scenario client-v5-throughput-websocket-qos1-1kib-1p1s \
              --runs 1 \
              --warmup-runs 0 \
              --cargo-profile dev \
              --output-dir /tmp/rumqtt-bench-websocket-fixture

      - name: Validate matched fault and connection contracts
        env:
          RUSTFLAGS: "-D warnings"
        run: |
            cargo test --locked -p benchmarks --test matched_fault_contract
            cargo test --locked -p benchmarks --test matched_connection_contract

  c-abi-sanitizers:
    name: C ABI sanitizers and leak checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri,rust-src

      - name: Install native analysis tools
        run: |
            sudo apt-get update
            sudo apt-get install -y clang valgrind

      - name: Run raw conversion tests under Miri
        run: cargo miri test -p rumqttc-c-next --lib

      - name: Build C library and sanitized native suite
        run: |
            cargo build -p rumqttc-c-next
            cmake -S rumqttc-c/tests/native -B target/rumqttc-c-native-sanitized \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
            cmake --build target/rumqttc-c-native-sanitized
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
              ctest --test-dir target/rumqttc-c-native-sanitized --output-on-failure

      - name: Check full native lifecycle for leaks
        env:
          RUMQTTC_C_STRESS_ITERATIONS: 100
          RUMQTTC_NATIVE_LAUNCHER: valgrind --error-exitcode=1 --leak-check=full --show-leak-kinds=definite --trace-children=yes
        run: |
            cmake -S rumqttc-c/tests/native -B target/rumqttc-c-native-valgrind
            cmake --build target/rumqttc-c-native-valgrind
            ctest --test-dir target/rumqttc-c-native-valgrind \
              -R 'rumqttc-native-(integration|stress)' --output-on-failure

  c-abi-platform-sanitizers:
    name: C native sanitizers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Build C library
        run: cargo build -p rumqttc-c-next

      - name: Build and run sanitized native suite (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
            cmake -S rumqttc-c/tests/native -B target/rumqttc-c-native-platform-sanitized \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
            cmake --build target/rumqttc-c-native-platform-sanitized
            ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
              ctest --test-dir target/rumqttc-c-native-platform-sanitized --output-on-failure

      - name: Check native lifecycle with macOS leaks
        if: ${{ runner.os == 'macOS' }}
        env:
          RUMQTTC_C_STRESS_ITERATIONS: 50
          RUMQTTC_NATIVE_LAUNCHER: leaks --atExit --
        run: |
            cmake -S rumqttc-c/tests/native -B target/rumqttc-c-native-leaks
            cmake --build target/rumqttc-c-native-leaks
            ctest --test-dir target/rumqttc-c-native-leaks \
              -R 'rumqttc-native-(integration|stress)' --output-on-failure

      - name: Build and run sanitized native suite (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
            cmake -S rumqttc-c/tests/native -B target/rumqttc-c-native-platform-sanitized `
              "-DCMAKE_C_FLAGS=/fsanitize=address"
            if ($LASTEXITCODE -ne 0) { throw "sanitizer configure failed" }
            cmake --build target/rumqttc-c-native-platform-sanitized --config Release
            if ($LASTEXITCODE -ne 0) { throw "sanitizer build failed" }
            ctest --test-dir target/rumqttc-c-native-platform-sanitized -C Release --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw "sanitized native suite failed" }

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: Linux-cargo-coverage

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack,cargo-llvm-cov,nextest

      - name: Install Mosquitto
        run: |
            sudo apt-get update
            sudo apt-get install -y mosquitto

      - name: Generate coverage report
        run: |
            cargo llvm-cov clean --workspace
            cargo hack --each-feature --exclude-all-features llvm-cov --no-clean -p rumqttc-v4-next nextest
            cargo hack --each-feature --exclude-all-features llvm-cov --no-clean -p rumqttc-v5-next nextest
            cargo llvm-cov report --lcov --output-path coverage.lcov

      - name: Upload coverage report
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage.lcov
