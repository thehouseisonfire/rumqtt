name: Native Windows file-store validation

on:
  push:
    branches:
      - main
    paths:
      - 'session-store-file/**'
      - 'rumqttc-v4/**'
      - 'rumqttc-v5/**'
      - 'rumqttc-core/**'
      - 'mqttbytes-core/**'
      - 'benchmarks/runner.py'
      - 'benchmarks/broker_fixture.py'
      - 'benchmarks/tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/session-store-file-windows.yml'
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: '-D warnings'
  RUST_BACKTRACE: 1

jobs:
  native-windows:
    name: File store on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["windows-2022","windows-latest"]' || '["windows-2022"]') }}
    env:
      ATOMIC_BLOB_TEST_ARTIFACT_DIR: ${{ github.workspace }}/windows-validation/test-artifacts
      ATOMIC_BLOB_PACKAGE_EVIDENCE_DIR: ${{ github.workspace }}/windows-validation/package

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.runner }}-atomic-blob-store-native-validation
          workspaces: session-store-file -> target

      - name: Record native environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-validation | Out-Null
          $report = Join-Path $env:GITHUB_WORKSPACE "windows-validation/environment.txt"
          "requested runner: ${{ matrix.runner }}" | Tee-Object -FilePath $report
          "runner name: $env:RUNNER_NAME" | Tee-Object -FilePath $report -Append
          "runner architecture: $env:RUNNER_ARCH" | Tee-Object -FilePath $report -Append
          "image OS: $env:ImageOS" | Tee-Object -FilePath $report -Append
          "image version: $env:ImageVersion" | Tee-Object -FilePath $report -Append
          Get-CimInstance Win32_OperatingSystem |
            Format-List Caption,Version,BuildNumber,OSArchitecture |
            Out-String | Tee-Object -FilePath $report -Append
          Get-CimInstance Win32_ComputerSystem |
            Format-List SystemType,NumberOfLogicalProcessors |
            Out-String | Tee-Object -FilePath $report -Append
          Get-Volume | Sort-Object DriveLetter |
            Format-Table DriveLetter,FileSystem,FileSystemLabel,HealthStatus,Size,SizeRemaining -AutoSize |
            Out-String | Tee-Object -FilePath $report -Append
          "workspace drive:" | Tee-Object -FilePath $report -Append
          fsutil fsinfo volumeinfo ([System.IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)) |
            Tee-Object -FilePath $report -Append
          "temporary drive:" | Tee-Object -FilePath $report -Append
          fsutil fsinfo volumeinfo ([System.IO.Path]::GetPathRoot($env:RUNNER_TEMP)) |
            Tee-Object -FilePath $report -Append
          rustc -Vv | Tee-Object -FilePath $report -Append
          cargo -V | Tee-Object -FilePath $report -Append

      - name: Run required debug, release, feature, workspace, and lint validation
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          mkdir -p windows-validation
          log="windows-validation/required-commands.log"
          run_logged() {
            local command_line
            printf -v command_line '%q ' "$@"
            printf 'command: %s\n' "${command_line}" | tee -a "$log"
            "$@" 2>&1 | tee -a "$log"
          }
          {
            echo "profile=debug features=no-default-features"
            echo "profile=debug features=all-features"
            echo "profile=release features=all-features"
            echo "profile=debug scope=workspace"
            echo "profile=debug command=clippy workspace/all-targets/all-features"
          } | tee -a "$log"
          run_logged cargo test --locked --manifest-path session-store-file/Cargo.toml \
            -p atomic-blob-store --no-default-features
          if cargo tree --locked --manifest-path session-store-file/Cargo.toml \
            -p atomic-blob-store --no-default-features | grep -Eq '(^| )tokio v'; then
            echo "blocking-only atomic-blob-store unexpectedly resolved Tokio" | tee -a "$log"
            exit 1
          fi
          run_logged cargo test --locked --manifest-path session-store-file/Cargo.toml \
            -p atomic-blob-store --all-features
          run_logged cargo test --locked --release --manifest-path session-store-file/Cargo.toml \
            -p atomic-blob-store --all-features
          run_logged cargo test --locked --manifest-path session-store-file/Cargo.toml \
            --workspace
          run_logged cargo clippy --locked --manifest-path session-store-file/Cargo.toml \
            --workspace --all-targets --all-features -- -D warnings

      - name: Repeat high-risk deterministic lifecycle and interruption cases
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          log="windows-validation/repeated-tests.log"
          tests=(
            tests::worker_join_panic_is_shared_by_close_callers
            tests::every_concurrent_close_waits_for_the_coordinator_to_stop
            tests::last_handle_drop_drains_an_accepted_complete_operation
            tests::last_handle_drop_drains_streaming_work_after_input_completion
            tests::blocked_cancelled_work_keeps_same_key_order_but_not_other_keys
            tests::dropping_streaming_save_after_input_completion_does_not_cancel_commit
            tests::windows_child_process_interruptions_leave_only_permitted_states
          )
          seeds=(5eedcafed15ca11e 5eedcafed15ca11f 5eedcafed15ca120)
          for iteration in 1 2 3; do
            echo "repeat iteration=${iteration}" | tee -a "$log"
            for test_name in "${tests[@]}"; do
              echo "iteration=${iteration} test=${test_name}" | tee -a "$log"
              cargo test --locked --manifest-path session-store-file/Cargo.toml \
                -p atomic-blob-store --all-features --lib "$test_name" -- \
                --exact --nocapture 2>&1 | tee -a "$log"
            done
            seed="${seeds[$((iteration - 1))]}"
            echo "iteration=${iteration} model_seed=0x${seed}" | tee -a "$log"
            ATOMIC_BLOB_MODEL_CASES=4 ATOMIC_BLOB_MODEL_SEED="$seed" \
              cargo test --locked --manifest-path session-store-file/Cargo.toml \
              -p atomic-blob-store --all-features --test model_sequences -- \
              --nocapture 2>&1 | tee -a "$log"
          done

      - name: Validate packaged blocking and Tokio consumers
        shell: bash
        timeout-minutes: 15
        run: session-store-file/scripts/validate-atomic-blob-package.sh

      - name: Upload native Windows validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: atomic-blob-store-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: windows-validation/
          if-no-files-found: warn
          retention-days: 30
