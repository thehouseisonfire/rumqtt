on:
  pull_request:
    branches:
      - main
      - mqtt5-client
    paths:
      - 'native-wrappers/**'
      - 'rumqttc-core/**'
      - 'rumqttc-v4/**'
      - 'rumqttc-v5/**'
      - 'mqttbytes-core/**'
      - 'mqttbytes-v4/**'
      - 'mqttbytes-v5/**'
      - 'CHANGELOG.md'
      - 'docs/c-abi-*.md'
      - 'pyproject.toml'
      - '.pre-commit-config.yaml'
      - 'scripts/publish-crates.sh'
      - 'scripts/publish-crates-alpha.sh'
      - '.github/workflows/c-api-release.yml'
      - '.github/workflows/native-wrappers-ci.yml'
  push:
    branches:
      - main

name: Native wrappers

permissions:
  contents: read
  attestations: read

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

defaults:
  run:
    shell: bash
    working-directory: native-wrappers

jobs:
  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: Linux-native-wrappers-msrv
          workspaces: native-wrappers -> target
      - run: cargo check --locked --workspace --all-targets

  test:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Enforce wrapper backend source boundary
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          if rg -n 'rumqttc_v[45]::' wrapper-core/src --glob '!**/backend/**'; then
            echo 'native protocol paths must remain inside wrapper-core/src/backend' >&2
            exit 1
          fi

      - uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-native-wrappers
          workspaces: native-wrappers -> target

      - name: Check formatting
        run: cargo fmt --all --check

      # Clippy below applies machine suggestions, so package the pristine checkout first.
      - name: Check published package contents
        if: ${{ runner.os == 'Linux' }}
        run: |
          cargo package --locked --list -p rumqttc-wrapper-core-next
          cargo package --locked --list -p rumqttc-c-next

      - name: Lint wrapper crates
        env:
          RUSTFLAGS: "-D warnings -W clippy::pedantic -W clippy::nursery"
        run: |
          cargo clippy --fix --allow-dirty --verbose --all-targets -p rumqttc-wrapper-core-next
          cargo clippy --fix --allow-dirty --verbose --all-targets -p rumqttc-c-next
          cargo clippy --fix --allow-dirty --verbose --all-targets -p rumqttc-python-next

      - name: Check documentation
        if: ${{ matrix.os != 'windows-latest' }}
        run: cargo doc --locked --workspace --no-deps

      - name: Run Rust tests
        run: |
          cargo test --locked --workspace
          cargo test --locked --workspace --doc

      - name: C FFI/header consistency
        if: ${{ runner.os != 'Windows' }}
        run: c/tests/abi/check.sh ffi-header

      - name: C FFI/header consistency (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: c/tests/abi/check.ps1 ffi-header

      - name: C current export policy
        if: ${{ runner.os != 'Windows' }}
        run: c/tests/abi/check.sh exports

      - name: C current export policy (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: c/tests/abi/check.ps1 exports

      - name: C native consumers
        if: ${{ runner.os != 'Windows' }}
        run: c/tests/abi/check.sh native

      - name: C native consumers (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: c/tests/abi/check.ps1 native

      - name: C native integration, stress, and examples
        run: |
          cmake -S c/tests/native -B target/rumqttc-c-native -DCMAKE_BUILD_TYPE=Debug
          cmake --build target/rumqttc-c-native --config Debug
          ctest --test-dir target/rumqttc-c-native -C Debug --output-on-failure

      - name: C package consumers
        if: ${{ runner.os != 'Windows' }}
        run: c/tests/abi/check.sh package

      - name: C package consumers (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: c/tests/abi/check.ps1 package

      - name: C ABI mutation corpus
        if: ${{ runner.os == 'Linux' }}
        run: |
          tool="$(c/tests/abi/install-abi-compliance-checker.sh)"
          python3 c/tests/abi/mutation_matrix.py --abicc "$tool" --output target/abi-mutations
          python3 -m unittest discover -s c/tests/abi -p 'test_*.py'

      - name: C historical ABI compatibility
        if: ${{ runner.os != 'Windows' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: c/tests/abi/compare-release.sh

      - name: C historical ABI compatibility (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: c/tests/abi/compare-release.ps1

      - name: Preserve C ABI diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: c-abi-diagnostics-${{ runner.os }}
          path: |
            native-wrappers/target/abi-mutations
            native-wrappers/target/abi-reports
          if-no-files-found: ignore

  c-abi-sanitizers:
    name: C ABI sanitizers and leak checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri,rust-src

      - name: Install native analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang valgrind

      - name: Run raw conversion tests under Miri
        run: cargo miri test -p rumqttc-c-next --lib

      - name: Build C library and sanitized native suite
        run: |
          cargo build -p rumqttc-c-next
          cmake -S c/tests/native -B target/rumqttc-c-native-sanitized \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build target/rumqttc-c-native-sanitized
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            ctest --test-dir target/rumqttc-c-native-sanitized --output-on-failure

      - name: Check full native lifecycle for leaks
        env:
          RUMQTTC_C_STRESS_ITERATIONS: 100
          RUMQTTC_NATIVE_LAUNCHER: valgrind --error-exitcode=1 --leak-check=full --show-leak-kinds=all --trace-children=yes --suppressions=${{ github.workspace }}/native-wrappers/c/tests/native/valgrind.supp
        run: |
          cmake -S c/tests/native -B target/rumqttc-c-native-valgrind
          cmake --build target/rumqttc-c-native-valgrind
          ctest --test-dir target/rumqttc-c-native-valgrind \
            -R 'rumqttc-native-(integration|stress)' --output-on-failure

  c-abi-platform-sanitizers:
    name: C native sanitizers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # MSVC 19.51 (Visual Studio 2026) hangs at process startup when these
        # ASan-instrumented C executables load the Rust cdylib. Keep this lane
        # on the stable Visual Studio 2022 ASan runtime until that toolchain
        # interoperability regression is resolved.
        os: [macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Build C library
        run: cargo build -p rumqttc-c-next

      - name: Build and run sanitized native suite (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
          cmake -S c/tests/native -B target/rumqttc-c-native-platform-sanitized \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build target/rumqttc-c-native-platform-sanitized
          ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            ctest --test-dir target/rumqttc-c-native-platform-sanitized --output-on-failure

      - name: Check native lifecycle with macOS leaks
        if: ${{ runner.os == 'macOS' }}
        env:
          RUMQTTC_C_STRESS_ITERATIONS: 50
          RUMQTTC_NATIVE_LAUNCHER: leaks --atExit --
        run: |
          cmake -S c/tests/native -B target/rumqttc-c-native-leaks
          cmake --build target/rumqttc-c-native-leaks
          ctest --test-dir target/rumqttc-c-native-leaks \
            -R 'rumqttc-native-(integration|stress)' --output-on-failure

      - name: Build and run sanitized native suite (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          cmake -S c/tests/native -B target/rumqttc-c-native-platform-sanitized `
            "-DCMAKE_C_FLAGS=/fsanitize=address /Zi" `
            "-DCMAKE_EXE_LINKER_FLAGS=/DEBUG"
          if ($LASTEXITCODE -ne 0) { throw "sanitizer configure failed" }
          cmake --build target/rumqttc-c-native-platform-sanitized --config Release
          if ($LASTEXITCODE -ne 0) { throw "sanitizer build failed" }
          $compilerConfig = Get-ChildItem `
            -Path target/rumqttc-c-native-platform-sanitized/CMakeFiles `
            -Recurse -Filter CMakeCCompiler.cmake |
            Select-Object -First 1
          if ($null -eq $compilerConfig) { throw "CMake C compiler configuration was not found" }
          $compiler = Select-String `
            -Path $compilerConfig.FullName `
            -Pattern '^set\(CMAKE_C_COMPILER "(.+)"\)$'
          if ($null -eq $compiler) { throw "CMake C compiler path was not found" }
          $compilerDirectory = Split-Path $compiler.Matches[0].Groups[1].Value
          $asanRuntime = Join-Path $compilerDirectory clang_rt.asan_dynamic-x86_64.dll
          if (-not (Test-Path $asanRuntime -PathType Leaf)) {
            throw "MSVC ASan runtime matching the selected compiler was not found at $asanRuntime"
          }
          $env:PATH = "$compilerDirectory;$env:PATH"
          ctest --test-dir target/rumqttc-c-native-platform-sanitized -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "sanitized native suite failed" }

  javascript:
    name: JavaScript wrapper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-rumqttc-js
          workspaces: native-wrappers -> target

      - name: Install JavaScript build tools
        working-directory: native-wrappers/js
        run: bun install --ignore-scripts

      - name: Build native addon
        working-directory: native-wrappers/js
        run: >-
          bunx @napi-rs/cli build --platform --release --features panic-testing
          --output-dir . --js-package-name rumqttc --no-js
          --dts ../../target/rumqttc-js-native.d.ts

      - name: Check TypeScript declarations and Node API
        working-directory: native-wrappers/js
        run: |
          bun run test:types
          bun run test:node
          bun run test:exports

      - name: Run Node MQTT behavior suite
        run: python3 c/tests/native/broker_fixture.py --binary node js/tests/shared/behavior.mjs

      - name: Install Deno
        if: ${{ runner.os == 'Linux' }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5

      - name: Run Deno MQTT behavior suite
        if: ${{ runner.os == 'Linux' }}
        run: >-
          python3 c/tests/native/broker_fixture.py --binary deno run --allow-net
          --allow-ffi --allow-env --allow-read js/tests/shared/behavior.mjs

      - name: Verify Deno exits with a live native client
        if: ${{ runner.os == 'Linux' }}
        run: >-
          timeout 10s deno run --allow-net --allow-ffi --allow-read
          js/tests/node/live-client-child.mjs

      - name: Run Bun MQTT behavior suite
        if: ${{ runner.os == 'Linux' }}
        run: python3 c/tests/native/broker_fixture.py --binary bun js/tests/shared/behavior.mjs

      - name: Verify Bun exits after native client shutdown
        if: ${{ runner.os == 'Linux' }}
        run: timeout 10s bun js/tests/node/live-client-child.mjs

      - name: Test installed packages through an ephemeral npm registry
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        working-directory: native-wrappers
        env:
          # Bun requires a configured token before it will send a publish request, even when the
          # ephemeral Verdaccio registry permits anonymous publication.
          NPM_CONFIG_TOKEN: rumqttc-ci-local-registry
        run: |
          cp js/rumqttc.linux-x64-gnu.node js/npm/linux-x64-gnu/
          bunx verdaccio@6.2.4 --config js/tests/package/verdaccio.yaml --listen 127.0.0.1:4873 &
          registry_pid=$!
          trap 'kill "$registry_pid"' EXIT
          registry_ready=false
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4873/-/ping; then registry_ready=true; break; fi
            sleep 1
          done
          test "$registry_ready" = true
          (cd js/npm/linux-x64-gnu && bun publish --registry http://127.0.0.1:4873 --access public)
          for directory in js/npm/*; do
            if [[ "$(basename "$directory")" != linux-x64-gnu ]]; then
              (cd "$directory" && bun publish --registry http://127.0.0.1:4873 --access public)
            fi
          done
          (cd js && bun publish --registry http://127.0.0.1:4873 --access public)
          project="$(mktemp -d)"
          cp js/tests/installed/smoke.mjs js/tests/installed/smoke.cjs js/tests/installed/deno-smoke.ts "$project/"
          (cd "$project" && bun add --registry http://127.0.0.1:4873 @rumqtt-next/rumqttc@0.1.0-alpha.0)
          python3 c/tests/native/broker_fixture.py --binary node "$project/smoke.mjs"
          python3 c/tests/native/broker_fixture.py --binary node "$project/smoke.cjs"
          python3 c/tests/native/broker_fixture.py --binary bun "$project/smoke.mjs"
          NPM_CONFIG_REGISTRY=http://127.0.0.1:4873 python3 c/tests/native/broker_fixture.py \
            --binary deno run --node-modules-dir=auto --minimum-dependency-age=0 --allow-ffi --allow-net \
            --allow-env=RUMQTTC_TEST_HOST,RUMQTTC_TEST_PORT,NPM_CONFIG_REGISTRY,RUMQTTC_JS_NATIVE_PATH \
            --allow-read="$project" "$project/deno-smoke.ts"

      - name: Verify package contents
        working-directory: native-wrappers/js
        shell: bash
        run: |
          archive="$(bun pm pack --quiet | tail -n 1)"
          python3 tests/package/verify_archive.py "$archive"

  python:
    name: Python wrapper (${{ matrix.os }}, CPython ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-rumqttc-python-${{ matrix.python }}
          workspaces: native-wrappers -> target

      - name: Build and install the extension
        working-directory: native-wrappers/python
        run: |
          uv sync --group dev
          uv run maturin develop

      - name: Check Python API and typing
        working-directory: native-wrappers/python
        run: |
          uv run ruff check python tests
          uv run ruff format --check python tests
          uv run pyrefly check python tests
          uv run pytest -q

      - name: Run MQTT behavior suite
        working-directory: native-wrappers
        run: >-
          python c/tests/native/broker_fixture.py --binary
          python/.venv/Scripts/python.exe python/tests/integration/test_broker.py
        if: ${{ runner.os == 'Windows' }}

      - name: Verify Windows exits with a live Python client
        working-directory: native-wrappers
        run: >-
          python c/tests/native/broker_fixture.py --binary
          python/.venv/Scripts/python.exe python/tests/lifecycle/live_client.py
        if: ${{ runner.os == 'Windows' }}

      - name: Run MQTT behavior suite
        working-directory: native-wrappers
        run: >-
          python3 c/tests/native/broker_fixture.py --binary
          python/.venv/bin/python python/tests/integration/test_broker.py
        if: ${{ runner.os != 'Windows' }}

      - name: Verify Unix exits with a live Python client
        working-directory: native-wrappers
        run: >-
          python3 c/tests/native/broker_fixture.py --binary
          python/.venv/bin/python python/tests/lifecycle/live_client.py
        if: ${{ runner.os != 'Windows' }}

      - name: Build and inspect a wheel
        working-directory: native-wrappers/python
        run: |
          uv run maturin build --release --out ../../target/python-wheels
          uv run python -c "import rumqttc; assert rumqttc.MqttClient.__module__ == 'rumqttc._client'"
