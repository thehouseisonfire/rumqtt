[workspace]
members = [
    "mqttbytes-core",
    "mqttbytes-v4",
    "mqttbytes-v5",
    "rumqttc-core",
    "rumqttc-next",
    "rumqttc-v4",
    "rumqttc-v5",
    "rumqttc-wrapper-core",
    "rumqttc-c",
    "benchmarks",
    "tests/low-memory",
]
exclude = ["session-store-file"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/thehouseisonfire/rumqtt"
license = "Apache-2.0"
authors = ["thehouseisonfire <lefttolive@proton.me>", "tekjar <raviteja@bytebeam.io>"]

[profile.dev]
# producing debug info in builds takes up a lot of space on runner, and we
# are currently not using it.
debug = false

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.profiling]
inherits = "release"
debug = 1
strip = false
